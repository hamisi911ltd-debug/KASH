name: CI

# Runs the tests and a production build on every push and pull request, so a
# change that breaks sign-in rules, permissions or the money maths is caught
# before it reaches customers.
on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
