<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C2A3D" />
    <meta name="description" content="KASH - track transport, food and hospitality from one dashboard." />
    <title>KASH - One Platform. Many Solutions.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      try {
        var t = localStorage.getItem("kash.theme") || "light";
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <style>
      /* ---- launch splash (shown before React mounts) ---- */
      #kash-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f5f7fa;
        transition: opacity 0.45s ease;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      }
      html.dark #kash-splash { background: #08202e; }
      #kash-splash.hide { opacity: 0; pointer-events: none; }
      #kash-splash .mark {
        height: 64px;
        width: auto;
        opacity: 0;
        transform: translateY(14px) scale(0.92);
        animation: kashMarkIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards, kashMarkFloat 2.4s ease-in-out 0.6s infinite;
      }
      #kash-splash .bar {
        width: 128px;
        height: 3px;
        border-radius: 99px;
        background: rgba(20, 34, 48, 0.1);
        overflow: hidden;
      }
      html.dark #kash-splash .bar { background: rgba(255, 255, 255, 0.14); }
      #kash-splash .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 42%;
        border-radius: 99px;
        background: #1e6ca8;
        animation: kashBar 1.05s ease-in-out infinite;
      }
      #kash-splash .cap {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #647689;
        opacity: 0;
        animation: kashFadeIn 0.5s ease 0.5s forwards;
      }
      html.dark #kash-splash .cap { color: #8fa7b4; }
      @keyframes kashMarkIn { to { opacity: 1; transform: none; } }
      @keyframes kashMarkFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes kashBar {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(320%); }
      }
      @keyframes kashFadeIn { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #kash-splash .mark, #kash-splash .cap, #kash-splash .bar::after { animation: kashFadeIn 0.2s ease forwards; }
      }
      /* app fades up once it takes over */
      #root { animation: kashAppIn 0.5s ease 0.15s both; }
      @keyframes kashAppIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="kash-splash" aria-hidden="true">
      <img class="mark" src="/logo.png" alt="" />
      <div class="bar"></div>
      <div class="cap">One Platform. Many Solutions.</div>
    </div>
    <div id="root"></div>
    <script>
      // Hard backstop: never let the splash get stuck if the bundle fails to load.
      setTimeout(function () {
        var s = document.getElementById("kash-splash");
        if (s && !s.classList.contains("hide")) { s.classList.add("hide"); setTimeout(function () { s.remove(); }, 500); }
      }, 6000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
