<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C2A3D" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KASH ERP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="KASH - track transport, food and hospitality from one dashboard." />
    <title>KASH - One Platform. Many Solutions.</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      try {
        var t = (localStorage.getItem("kash.theme") || "").replace(/[\\"]/g, "") === "dark" ? "dark" : "light";
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <style>
      /* ---- launch splash: the KASH logo animates in, then the app opens (about 3 seconds) ---- */
      #kash-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(120% 90% at 50% 38%, #14396b 0%, #0a1f3d 55%, #06142a 100%);
        transition: opacity .4s ease;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      }
      #kash-splash.hide { opacity: 0; pointer-events: none; }
      #kash-splash .lw { position: relative; width: min(240px, 62vw); aspect-ratio: 700 / 269; opacity: 0; transform: scale(.72) translateY(10px); filter: blur(6px);
        animation: kashLogoIn .7s cubic-bezier(.2, 1.1, .3, 1) .05s forwards, kashGlow 2.4s ease-in-out .8s infinite; }
      #kash-splash .lw img { display: block; width: 100%; height: 100%; }
      #kash-splash .shine { position: absolute; inset: 0; pointer-events: none;
        -webkit-mask: url(/logo.webp) center / contain no-repeat; mask: url(/logo.webp) center / contain no-repeat;
        background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%) no-repeat; background-size: 260% 100%; background-position: 160% 0;
        animation: kashShine 1s ease .65s forwards; }
      #kash-splash .gs { width: min(240px, 62vw); font-weight: 800; font-size: 13px; letter-spacing: .07em; color: #fff; text-transform: uppercase; white-space: nowrap;
        opacity: 0; transform: translateY(6px); animation: kashRise .5s ease .95s forwards; }
      #kash-splash .tag { font-size: 12.5px; font-weight: 600; color: #9fb6d6; letter-spacing: .02em; opacity: 0; animation: kashRise .5s ease 1.3s forwards; }
      #kash-splash .bar { width: min(240px, 62vw); height: 4px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; margin-top: 10px; opacity: 0; animation: kashRise .4s ease 1.1s forwards; }
      #kash-splash .bar i { display: block; height: 100%; width: 100%; border-radius: 99px; transform: scaleX(0); transform-origin: left;
        background: linear-gradient(90deg, #1e6cc8 0 25%, #17b6a3 25% 50%, #f5a800 50% 75%, #e0244a 75% 100%); animation: kashFill 1.25s cubic-bezier(.4, 0, .2, 1) 1.15s forwards; }
      @keyframes kashLogoIn { to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes kashGlow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(255,196,40,0)); } 50% { filter: drop-shadow(0 6px 22px rgba(255,196,40,.35)); } }
      @keyframes kashShine { to { background-position: -60% 0; } }
      @keyframes kashRise { to { opacity: 1; transform: none; } }
      @keyframes kashFill { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #kash-splash .lw, #kash-splash .gs, #kash-splash .tag, #kash-splash .bar { animation: kashRise .2s ease forwards; transform: none; filter: none; }
        #kash-splash .shine { display: none; }
        #kash-splash .bar i { animation: kashFill .4s ease forwards; }
      }
      /* app fades up once it takes over */
      #root { animation: kashAppIn 0.5s ease 0.15s both; }
      @keyframes kashAppIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="kash-splash" aria-hidden="true">
      <div class="lw"><img src="/logo.webp" width="240" height="92" alt=""><span class="shine"></span></div>
      <div class="gs"><svg viewBox="0 0 240 17" width="100%" role="img" aria-label="General Suppliers"><text x="0" y="14" textLength="240" lengthAdjust="spacingAndGlyphs" font-weight="800" font-size="16" fill="#ffffff" font-family="Plus Jakarta Sans, system-ui, sans-serif">GENERAL SUPPLIERS</text></svg></div>
      <div class="tag">One Platform. Many Solutions.</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script>
      // Hard backstop: never let the splash get stuck if the bundle fails to load.
      setTimeout(function () {
        var s = document.getElementById("kash-splash");
        if (s && !s.classList.contains("hide")) { s.classList.add("hide"); setTimeout(function () { s.remove(); }, 500); }
      }, 6000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
